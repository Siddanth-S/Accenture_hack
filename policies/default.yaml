id: preflight-in-default
jurisdiction: "IN — DPDP Act 2023"
retention_days: 180

# Thresholds below are PRODUCED BY CALIBRATION, not hand-picked.
# `python -m eval.calibrate` regenerates them from a labelled set at a chosen
# risk budget. Editing them by hand voids the conformal guarantee — the
# comment on each rule records the alpha it was derived at.

use_cases:

  default:
    stakes: medium
    latency_budget_ms: 250
    cost_budget_usd: 0.05
    session_budget_usd: 0.50
    fail_closed: true
    on_budget_exceeded: escalate
    rules:
      - {axis: groundedness, threshold: 0.55, action: regenerate}
      - {axis: privacy,      threshold: 0.50, action: redact}
      - {axis: injection,    threshold: 0.70, action: escalate}
      - {axis: escalation_gradient, threshold: 0.55, action: escalate,
         note: "trajectory signal — invisible to any single-response checker"}
      - {axis: contamination,       threshold: 0.50, action: regenerate}

  support_assistant:
    # Customer-facing. High volume, tight latency, moderate stakes.
    # Over-flagging here is expensive: it lands in front of a real customer.
    stakes: medium
    latency_budget_ms: 180
    cost_budget_usd: 0.02
    session_budget_usd: 0.25
    fail_closed: false          # low stakes -> fail open, log as unchecked
    on_budget_exceeded: pass
    require_citations: false
    allowed_models: [gpt-4o-mini, claude-haiku-4-5, claude-sonnet-5]
    rules:
      - {axis: groundedness, threshold: 0.60, action: regenerate}   # alpha=0.10
      - {axis: privacy,      threshold: 0.40, action: redact}
      - {axis: injection,    threshold: 0.70, action: escalate}
      - {axis: cost,         threshold: 0.90, action: escalate}
      - {axis: escalation_gradient, threshold: 0.50, action: escalate}
      - {axis: contamination,       threshold: 0.45, action: regenerate}
      - {axis: retry_burn,          threshold: 0.60, action: escalate,
         note: "3+ reformulations means the model is failing at something"}

  internal_copilot:
    # Employees, not customers. Higher risk tolerance, looser data governance
    # upstream, so injection via retrieved documents matters more here.
    stakes: low
    latency_budget_ms: 300
    cost_budget_usd: 0.03
    session_budget_usd: 1.00
    fail_closed: false
    on_budget_exceeded: pass
    allowed_models: [local/qwen2.5-1.5b, gpt-4o-mini, claude-haiku-4-5,
                     claude-sonnet-5]
    rules:
      - {axis: groundedness, threshold: 0.75, action: pass_with_citations}
      - {axis: privacy,      threshold: 0.60, action: redact}
      - {axis: injection,    threshold: 0.60, action: escalate}
      - {axis: escalation_gradient, threshold: 0.60, action: escalate}
      - {axis: cost_creep,          threshold: 0.85, action: escalate}

  lending_decision:
    # Regulated, adverse-action consequences, irreversible.
    # Everything runs. Nothing is downgraded. Fails closed.
    stakes: critical
    latency_budget_ms: 2500
    cost_budget_usd: 0.30
    session_budget_usd: 2.00
    fail_closed: true
    on_budget_exceeded: escalate
    require_citations: true
    allowed_models: [claude-sonnet-5, claude-opus-5, gpt-4o]
    rules:
      - {axis: groundedness, threshold: 0.30, action: escalate}   # alpha=0.02
      - {axis: uncertainty,  threshold: 0.40, action: escalate}
      - {axis: bias,         threshold: 0.25, action: escalate,
         note: "adverse action on a protected attribute is a legal event"}
      - {axis: privacy,      threshold: 0.30, action: redact}
      - {axis: injection,    threshold: 0.40, action: escalate}
      - {axis: escalation_gradient, threshold: 0.35, action: escalate}
      - {axis: contamination,       threshold: 0.25, action: escalate,
         note: "a decision reasoned from an ungrounded premise is the worst case"}
